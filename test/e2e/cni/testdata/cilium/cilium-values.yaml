affinity:
  nodeAffinity:
    requiredDuringSchedulingIgnoredDuringExecution:
      nodeSelectorTerms:
      - matchExpressions:
        - key: eks.amazonaws.com/compute-type
          operator: In
          values:
          - hybrid
operator:
  image:
    repository: "public.ecr.aws/eks/cilium/operator"
    tag: "v1.19.7-1"
    imagePullPolicy: "IfNotPresent"
    digest: "sha256:5ef56041ad634e14bfbad0dd2a7a85e3a043a79236a4d9b15da796f28bf86f43"
  replicas: 1
  unmanagedPodWatcher:
    restart: false
  # the cilium-operator by default tolerations all taints
  # this makes draining a difficult if the operator is running on that node
  # since it will just immediately restart
  # this restricts the toleration to the one needed during initialization
  # more info: https://github.com/cilium/cilium/pull/28856
  tolerations:
    - key: node.kubernetes.io/not-ready
      operator: Exists
    - key: node.cilium.io/agent-not-ready
      operator: Exists
ipam:
  mode: cluster-pool
envoy:
  enabled: false
image:
  repository: "public.ecr.aws/eks/cilium/cilium"
  tag: "v1.19.7-1"
  imagePullPolicy: "IfNotPresent"
  digest: "sha256:b5c647dc21ec9c822b0af09720c9ea546449d7169958df0ba0d9f5ed7f5671a1"
preflight:
  image:
    repository: "public.ecr.aws/eks/cilium/cilium"
    tag: "v1.19.7-1"
    imagePullPolicy: "IfNotPresent"
    digest: "sha256:b5c647dc21ec9c822b0af09720c9ea546449d7169958df0ba0d9f5ed7f5671a1"
